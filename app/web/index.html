<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="servicos_manaus_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>servicos_manaus_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Cropper.js -- exigido pelo pacote `image_cropper` (recorte de foto de
    perfil) quando roda no Flutter Web. O modal "Crop Image" (título, imagem,
    slider de zoom, botões girar/Cancel/Crop) é desenhado pelo próprio
    plugin em Dart e aparece de qualquer jeito, MESMO sem esses dois tags --
    mas arrastar pra reposicionar e o slider de zoom só funcionam de verdade
    através desta biblioteca JS, que o plugin carrega por baixo dos panos.
    Sem ela, os controles ficam visíveis só que "mortos" (exatamente o
    sintoma relatado: aparece tudo, mas nada responde ao toque/arraste).
  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
